[project]
name = "avia-geo-fusion"
version = "0.1.0"
description = "UAV geolocation project without GPS"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "folium>=0.14.0",
    "geopy>=2.3.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "mercantile>=1.2.1",
    "pyyaml>=6.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "plotly>=5.17.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14.0",
    "rasterio>=1.3.9",
    "shapely>=2.0.0"
]
semantic = [
    "openmim",
    "mmsegmentation>=1.0.0",
    "mmcv-lite>=2.0.0rc4,<2.2.0",
    "mmengine>=0.3.0"
]
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.15.0"
]
all = [
    "avia-geo-fusion[geo,semantic,dev]"
]

[tool.setuptools]
packages = ["src"]
